introduction.developer.description: |
  私はソフトウェア開発に深い興味を持っています。
  <b>Web・バックエンド開発</b>から<b>ゲーム開発、機械学習、DevOps、プログラミング言語</b>まで、
  幅広い分野に興味を持っています。
introduction.enthusiast.description: |
  また、誰かの記憶に残るものを作るために、
  <b>Webデザイン、3Dモデリング・アート、印刷物のデザイン、サウンドデザイン</b>など、
  さまざまな分野にも興味を持ち、挑戦しています。
